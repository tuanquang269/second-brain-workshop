<svg class="an" viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bộ não thứ hai: 4 lớp, 3 động từ, sản phẩm ra ngoài não">
<style>
.an text{font-family:var(--font);fill:var(--text)}
.an .mono{font-family:var(--mono)}
.an .vault{fill:none;stroke:var(--line);stroke-width:2}
.an .vault-t{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:.2em;fill:var(--dim)}
.an .box{fill:var(--surface);stroke:var(--teal);stroke-width:2}
.an .box.out{stroke:var(--accent)}
.an .n{font-family:var(--mono);font-size:30px;font-weight:700;fill:var(--teal)}
.an .n.ac{fill:var(--accent)}
.an .s{font-size:17px;fill:var(--dim)}
.an .s.teal{fill:var(--teal)}
.an .s.ac{fill:var(--accent)}
.an .chip{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.an .chip-t{font-size:15px;fill:var(--text)}
.an .pill{fill:none;stroke:var(--accent);stroke-width:2}
.an .pill-t{font-family:var(--mono);font-size:16px;fill:var(--text)}
.an .arrow{stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.an .head{fill:var(--accent)}
.an .verb{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:.1em;fill:var(--accent)}
.an .verb-s{font-size:15px;fill:var(--dim)}
.an .strip{fill:var(--surface);stroke:var(--line);stroke-width:2}
.an .bound{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:10 9;opacity:.7}
.an .bound-t{font-family:var(--mono);font-size:14px;letter-spacing:.1em;fill:var(--accent)}
.an .fix{fill:var(--accent)}
.an .fix-b{font-family:var(--mono);font-size:13px;font-weight:700;fill:var(--bg)}
.an .fix-t{font-family:var(--mono);font-size:14px;fill:var(--accent)}
.an .eng{font-family:var(--mono);font-size:16px;fill:var(--text)}
.an .lvl{font-family:var(--mono);font-size:16px;fill:var(--dim)}
.an .ico{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
</style>

<!-- ===== vault ===== -->
<rect class="vault" x="26" y="70" width="1108" height="560" rx="18"/>
<text class="vault-t" x="52" y="104">BỘ NÃO · VAULT OBSIDIAN · CHỈ .MD</text>

<!-- DISTILL (label row, above the boxes) -->
<text class="verb" x="330" y="138">DISTILL</text>
<path class="ico" d="M448 118 h30 L466 137 v14 h-6 v-14 Z"/>

<!-- HARNESS (label row) -->
<text class="verb" x="1150" y="138">HARNESS</text>
<path class="ico" d="M1292 120 h34 M1298 120 v16 M1319 120 v16 M1292 140 h34"/>

<!-- 1_Nguồn -->
<rect class="box" x="60" y="152" width="262" height="182" rx="12"/>
<text class="n" x="84" y="196">1_Nguồn</text>
<text class="s" x="84" y="228">bài viết · PDF · transcript</text>
<text class="s" x="84" y="254">tin nhắn · khoá học</text>
<text class="s teal" x="84" y="308">không bao giờ sửa bản gốc</text>

<line class="arrow" x1="334" y1="243" x2="382" y2="243"/>
<path class="head" d="M382 229 L408 243 L382 257 Z"/>

<!-- 2_Wiki -->
<rect class="box" x="420" y="152" width="336" height="182" rx="12"/>
<text class="n" x="444" y="196">2_Wiki</text>
<text class="s" x="444" y="224">1 trang = 1 ý · có link · có nguồn</text>
<rect class="chip" x="444" y="238" width="94" height="30" rx="15"/><text class="chip-t" x="459" y="258">Tóm tắt</text>
<rect class="chip" x="546" y="238" width="102" height="30" rx="15"/><text class="chip-t" x="561" y="258">Thực thể</text>
<rect class="chip" x="656" y="238" width="86" height="30" rx="15"/><text class="chip-t" x="670" y="258">So sánh</text>
<rect class="chip" x="444" y="276" width="106" height="30" rx="15"/><text class="chip-t" x="459" y="296">Khái niệm</text>
<rect class="chip" x="558" y="276" width="102" height="30" rx="15"/><text class="chip-t" x="573" y="296">Tổng hợp</text>

<line class="arrow" x1="768" y1="243" x2="792" y2="243" style="stroke-width:5;opacity:.45"/>

<!-- 3_Tôi -->
<rect class="box" x="810" y="152" width="286" height="182" rx="12"/>
<text class="n" x="834" y="196">3_Tôi</text>
<text class="s" x="834" y="228">giọng văn · dữ kiện riêng</text>
<text class="s" x="834" y="254">khách hàng · sản phẩm · luật</text>
<text class="s teal" x="834" y="308">thứ AI không tra được</text>

<!-- WIRE -->
<text class="verb" x="60" y="382">WIRE</text>
<path class="ico" d="M158 366 h18 M158 378 h18 M178 360 v24 a13 13 0 0 0 13 -12 a13 13 0 0 0 -13 -12 z"/>
<text class="verb-s" x="214" y="382">agent tìm được · chạy lại được</text>
<rect class="strip" x="60" y="396" width="1036" height="92" rx="12"/>
<rect class="pill" x="86" y="418" width="292" height="46" rx="23"/>
<text class="pill-t" x="106" y="447">CLAUDE.md <tspan class="s">(= AGENTS.md)</tspan></text>
<rect class="pill" x="398" y="418" width="196" height="46" rx="23"/><text class="pill-t" x="418" y="447">index-muc-luc</text>
<rect class="pill" x="614" y="418" width="164" height="46" rx="23"/><text class="pill-t" x="634" y="447">log-nhat-ky</text>
<rect class="pill" x="798" y="418" width="150" height="46" rx="23"/><text class="pill-t" x="818" y="447">mistakes</text>
<circle class="fix" cx="956" cy="414" r="11"/><text class="fix-b" x="951" y="419">+</text>

<!-- engine -->
<rect class="strip" x="60" y="512" width="1036" height="96" rx="12"/>
<path class="ico" d="M92 540 h34 v28 h-34 z M100 550 l8 4 -8 4"/>
<text class="eng" x="142" y="548">Claude Code chạy <tspan class="s ac">trong thư mục này</tspan> · ghi file thật</text>
<text class="lvl" x="142" y="582">bậc 1 prompt → 2 <tspan style="fill:var(--text);font-weight:700">skill</tspan> → 3 agent boss → 4 app · càng lên: gõ ít hơn, giữ nhiều hơn</text>

<!-- ===== boundary ===== -->
<line class="bound" x1="1160" y1="70" x2="1160" y2="630"/>
<text class="bound-t" x="1176" y="656">tri thức vào · sản phẩm ra</text>

<line class="arrow" x1="1104" y1="243" x2="1186" y2="243"/>
<path class="head" d="M1186 228 L1214 243 L1186 258 Z"/>

<!-- 4_Kết quả (outside the vault) -->
<rect class="box out" x="1232" y="152" width="338" height="182" rx="12"/>
<text class="n ac" x="1256" y="196">4_Kết quả</text>
<text class="s" x="1256" y="228">ad · báo cáo · SOP · email</text>
<text class="s" x="1256" y="254">ở <tspan class="mono">~/PATI/work</tspan> — ngoài não</text>
<text class="s ac" x="1256" y="308">não không phình theo sản phẩm</text>
<circle class="fix" cx="1552" cy="170" r="11"/><text class="fix-b" x="1548" y="175">!</text>

<text class="verb-s" x="1180" y="370">cửa: STOP · xem nháp · verdict → log</text>

<!-- fix legend -->
<circle class="fix" cx="1192" cy="420" r="10"/><text class="fix-b" x="1188" y="425">!</text>
<text class="fix-t" x="1214" y="425">sửa: kết quả ra ngoài vault</text>
<circle class="fix" cx="1192" cy="458" r="10"/><text class="fix-b" x="1188" y="463">+</text>
<text class="fix-t" x="1214" y="463">thêm: mistakes.md = học từ lỗi</text>
<circle class="fix" cx="1192" cy="496" r="10"/><text class="fix-b" x="1188" y="501">✓</text>
<text class="fix-t" x="1214" y="501">CLAUDE.md, không AGENT.md</text>
<circle class="fix" cx="1192" cy="534" r="10"/><text class="fix-b" x="1188" y="539">✓</text>
<text class="fix-t" x="1214" y="539">5 loại trang = 5 <tspan class="mono">type:</tspan></text>
<circle class="fix" cx="1192" cy="572" r="10"/><text class="fix-b" x="1188" y="577">✓</text>
<text class="fix-t" x="1214" y="577">chat web không ghi file</text>
</svg>
